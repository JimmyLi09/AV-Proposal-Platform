# 部署配置默认值。服务器上要改的项目，复制到同目录的 deploy.local.yaml 里改（该文件不进 git，
# 更新代码时不会被覆盖），例：data_dir: 'D:\avp-data'。规则系数、产品、模板不放这里，都在界面里改。
host: 0.0.0.0
port: 8081
# 资料目录：数据库、原件、生成文件都放这里。相对路径以项目根目录为准。
# 示例值，正式路径见清单 A9（例：D:\avcalc-data）。
data_dir: ./data
# DWG 读取：免费的 ODA File Converter 安装路径，例：'C:\Program Files\ODA\ODAFileConverter\ODAFileConverter.exe'
# 留空 = 没装，DWG 只随项目保存。
oda_converter: ""
# 资料库（CR-8）文件夹：以往项目、规格书、图纸、BOQ、模板与条款各放一个子文件夹（第一次启动时自动建好）。
# 留空 = 资料目录下的 knowledge（例：D:\avp-data\knowledge）。原文件只读，平台不移动、不改名。
knowledge_dir: ""
# 每晚自动复扫的时间（服务器本地时间，24 小时制）
knowledge_scan_at: "02:00"
# 方案演示稿（PPT）的公司母版：.potx 或 .pptx 的完整路径，例：'D:\avp-data\templates\Audax.potx'。
# 留空 = 用内置的 Audax 配色版式。
deck_template: ""
# 备份文件夹（设置页「立即备份」）：数据库和资料目录（原件、生成文件）打包成一个 zip 放这里，最好在另一块盘或网络盘。
# 留空 = 资料目录下的 backups（例：D:\avp-data\backups）。资料库文件夹是公司共享的原资料，不打包。
backup_dir: ""
# 项目平台地址：设置页只显示，平台不连接它（项目只通过项目编号关联）
project_platform_url: "http://192.168.1.241:3000"
